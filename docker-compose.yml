# =============================================================================
# Docker Compose for Table Extraction System
# =============================================================================

version: '3.8'

services:
  # =============================================================================
  # Main API Service
  # =============================================================================
  api:
    build:
      context: .
      target: production
    image: table-extraction-api:latest
    container_name: table-extraction-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-password}@db:5432/table_extraction
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - MODEL_DEVICE=cpu
      - STORAGE_TYPE=local
      - STORAGE_PATH=/app/data/uploads
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/exports:/app/data/exports
      - ./models/weights:/app/models/weights:ro
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - table-extraction-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # API with GPU Support
  # =============================================================================
  api-gpu:
    build:
      context: .
      target: gpu-production
    image: table-extraction-api:gpu
    container_name: table-extraction-api-gpu
    ports:
      - "8001:8000"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - MODEL_DEVICE=cuda
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-password}@db:5432/table_extraction
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./models/weights:/app/models/weights:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - db
      - redis
    profiles:
      - gpu
    networks:
      - table-extraction-network

  # =============================================================================
  # Celery Worker for Background Tasks
  # =============================================================================
  worker:
    build:
      context: .
      target: production
    image: table-extraction-api:latest
    container_name: table-extraction-worker
    command: celery -A src.tasks.celery_app worker --loglevel=info
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-password}@db:5432/table_extraction
      - MODEL_DEVICE=cpu
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./models/weights:/app/models/weights:ro
    depends_on:
      - redis
      - db
    restart: unless-stopped
    networks:
      - table-extraction-network

  # =============================================================================
  # Celery Beat Scheduler
  # =============================================================================
  beat:
    build:
      context: .
      target: production
    image: table-extraction-api:latest
    container_name: table-extraction-beat
    command: celery -A src.tasks.celery_app beat --loglevel=info
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - table-extraction-network

  # =============================================================================
  # PostgreSQL Database
  # =============================================================================
  db:
    image: postgres:15-alpine
    container_name: table-extraction-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
      - POSTGRES_DB=table_extraction
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - table-extraction-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # Redis Cache & Message Broker
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: table-extraction-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - table-extraction-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # MinIO Object Storage (S3-compatible)
  # =============================================================================
  minio:
    image: minio/minio:latest
    container_name: table-extraction-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    networks:
      - table-extraction-network
    profiles:
      - storage

  # =============================================================================
  # Prometheus Monitoring
  # =============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: table-extraction-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - table-extraction-network
    profiles:
      - monitoring

  # =============================================================================
  # Grafana Dashboard
  # =============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: table-extraction-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - table-extraction-network
    profiles:
      - monitoring

  # =============================================================================
  # Flower - Celery Monitoring
  # =============================================================================
  flower:
    image: mher/flower:latest
    container_name: table-extraction-flower
    command: celery flower --broker=redis://redis:6379/1
    ports:
      - "5555:5555"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - table-extraction-network
    profiles:
      - monitoring

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:

# =============================================================================
# Networks
# =============================================================================
networks:
  table-extraction-network:
    driver: bridge
