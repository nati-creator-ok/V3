# Prometheus configuration for Table Extraction System
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # API metrics
  - job_name: 'table-extraction-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    
  # Node exporter (if deployed)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    
  # Redis metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    
  # PostgreSQL metrics  
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
